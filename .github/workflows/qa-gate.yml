name: QA Gate

on:
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Install MCP dependencies
        run: pnpm --dir packages/mcp install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test MCP package
        run: pnpm --dir packages/mcp test

      - name: Build MCP package
        run: pnpm --dir packages/mcp build

  automerge-gate:
    name: automerge-gate
    runs-on: ubuntu-latest
    needs: [tests]
    if: ${{ always() }}
    steps:
      - name: Require tests to pass
        env:
          TESTS_RESULT: ${{ needs.tests.result }}
        run: |
          if [ "$TESTS_RESULT" != "success" ]; then
            echo "tests result: $TESTS_RESULT"
            exit 1
          fi
